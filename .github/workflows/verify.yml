# Zero-Trust Code Verification (dogfood: the public repo verifies itself).
#
# Developers copy-paste this file into their own repository and add the
# Meta API key secret. The pull request is verified through the shared
# issues namespace: every PR number is also a valid /issues/<n> address,
# which is exactly what `hackproof verify --issue` consumes.
name: Zero-Trust Code Verification

"on":
  pull_request:

# Step 3.4: the verify run posts staged audit comments, pushes the
# hackproof/issue-<n> branch and opens the verified PR — all three
# need explicit write grants on tokens with restricted defaults.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          meta-api-key: ${{ secrets.META_API_KEY }}
          issue-url: https://github.com/${{ github.repository }}/issues/${{ github.event.pull_request.number }}
