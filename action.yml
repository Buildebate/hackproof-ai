name: "HackProof AI Zero-Trust Verification"
description: >-
  Run the HackProof AI red-to-green pipeline (regression synthesis,
  asymmetric debate, deterministic patch, guard) against a GitHub issue.
  Lean by design: installs only the published package, never the heavy
  retrieval backends (torch/contriever/faiss).
author: "Buildebate"

branding:
  icon: "shield"
  color: "green"

inputs:
  meta-api-key:
    description: "Meta Model API key (dev.meta.ai grant). Passed ONLY via env, never echoed."
    required: true
  issue-url:
    description: "GitHub issue URL, e.g. https://github.com/<owner>/<repo>/issues/42"
    required: true
  runner-mode:
    description: "Sandbox tier: 'local' (air-gapped subprocess) or 'oci' (gVisor over SSH)."
    required: false
    default: "local"
  python-version:
    description: "Python version for the runner."
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - name: "Set up Python"
      uses: "actions/setup-python@v5"
      with:
        python-version: "${{ inputs.python-version }}"

    - name: "Install hackproof-ai"
      # Pinned minimum from this release; PROD final lands in Step 5.2.
      # No torch/contriever/faiss here: PR runners stay within 2vCPU/7GB.
      run: pip install "hackproof-ai>=0.2.0rc1"
      shell: bash

    - name: "Verify issue red-to-green"
      run: hackproof verify --issue "${{ inputs.issue-url }}" --runner "${{ inputs.runner-mode }}"
      shell: bash
      env:
        META_API_KEY: "${{ inputs.meta-api-key }}"
