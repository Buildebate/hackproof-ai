[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackproof-ai"
version = "0.2.0rc1"
description = "Autonomous Zero-Trust Adversarial Engineering Engine for Meta Global AI Hackathon 2026"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Buildebate Team", email = "core@buildebate.com" },
]
keywords = [
    "zero-trust",
    "adversarial",
    "security",
    "red-teaming",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.9.0",
]
retrieval = [
    "faiss-cpu>=1.7.4",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
hackproof = "hackproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hackproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
